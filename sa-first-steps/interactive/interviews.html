<!doctype html>
<html lang="ru">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Круг интервью</title>
<style>
  :root {
    color-scheme: light;
    --surface: #fcfcfb; --ink: #0b0b0b; --ink2: #52514e; --muted: #898781;
    --grid: #e1e0d9; --axis: #c3c2b7; --s1: #2a78d6; --s2: #eb6834; --good: #006300;
  }
  * { box-sizing: border-box; }
  body { margin: 0; background: var(--surface); color: var(--ink);
         font: 15px/1.45 system-ui, -apple-system, "Segoe UI", sans-serif; }
  .wrap { max-width: 820px; margin: 0 auto; padding: 16px; }
  h1 { font-size: 18px; margin: 0 0 4px; font-weight: 600; }
  .sub { color: var(--ink2); margin: 0 0 14px; }

  .people { display: flex; flex-wrap: wrap; gap: 8px; margin-bottom: 16px; }
  .person { font: inherit; font-size: 13px; text-align: left; padding: 8px 12px; border-radius: 10px;
            border: 1px solid var(--axis); background: #fff; color: var(--ink); cursor: pointer;
            transition: border-color .12s ease, background .12s ease; }
  .person:hover { border-color: var(--s1); }
  .person[aria-pressed="true"] { border-color: var(--s1); background: #eaf2fd; }
  .person.done::after { content: " ✓"; color: var(--good); }
  .person .role { display: block; color: var(--muted); font-size: 11px; }

  .turn { color: var(--muted); font-size: 13px; margin-bottom: 6px; }
  .q { font-weight: 600; margin-bottom: 10px; }
  .opts { display: grid; gap: 8px; }
  button.opt { font: inherit; text-align: left; padding: 10px 12px; border-radius: 10px;
               border: 1px solid var(--axis); background: #fff; color: var(--ink); cursor: pointer; }
  button.opt:hover { border-color: var(--s1); }
  .said { border-left: 3px solid var(--axis); padding: 2px 0 2px 12px; margin: 14px 0 0; }
  .said .who { color: var(--muted); font-size: 13px; }
  .mine .who { color: var(--s1); }
  .verdict { margin-top: 10px; padding: 10px 12px; border-radius: 10px; background: #f3f2ec;
             color: var(--ink2); }
  .got { margin-top: 8px; color: var(--good); font-weight: 600; font-size: 14px; }

  .sheet { margin-top: 18px; border-top: 1px solid var(--grid); padding-top: 12px; }
  .sheet h2 { font-size: 14px; margin: 0 0 8px; color: var(--ink2); font-weight: 600; }
  table { border-collapse: collapse; width: 100%; font-size: 13.5px; }
  th, td { text-align: left; padding: 5px 8px; border-bottom: 1px solid var(--grid); vertical-align: top; }
  th { color: var(--muted); font-weight: 600; font-size: 12px; }
  td.src { color: var(--ink2); white-space: nowrap; }
  .none { color: var(--muted); }
  .count { font-variant-numeric: tabular-nums; }
  .final { margin-top: 14px; padding: 12px 14px; border-radius: 10px; border: 1px solid var(--axis);
           background: #fff; }
  button.again { font: inherit; padding: 7px 14px; border-radius: 8px; border: 1px solid var(--axis);
                 background: #fff; color: var(--ink2); cursor: pointer; margin-top: 12px; }
  .fade { animation: fade .22s ease-out; }
  @keyframes fade { from { opacity: 0; transform: translateY(3px); } to { opacity: 1; transform: none; } }
  @media (prefers-reduced-motion: reduce) { .fade { animation: none; } }
</style>
</head>
<body>
<div class="wrap">
  <h1>Круг интервью</h1>
  <p class="sub">Четыре собеседника, по три вопроса каждому. Сильный вопрос приносит требование в список
     справа, слабый — вежливый ответ ни о чём. Выбирай, с кого начать.</p>

  <div class="people" id="people"></div>
  <div id="stage"></div>

  <div class="sheet">
    <h2>Список требований: <span class="count" id="score">0</span> из
        <span class="count" id="total"></span></h2>
    <table id="sheet"><tbody><tr><td class="none">пока пусто</td></tr></tbody></table>
  </div>
  <div id="finish"></div>
</div>
<script>
const DATA = {"people": [{"id": "director", "person": "Директор", "role": "заказчик проекта", "rounds": [{"question": "С чего начнёшь разговор?", "options": [{"text": "Что вы делаете сейчас, когда нужен отчёт по школе?", "answer": "Завуч выгружает оценки, неделю сводит в таблице, потом мы неделю ищем расхождения. И так каждый месяц.", "requirement": "Сводный отчёт по школе собирается автоматически, без ручного сведения", "verdict": "Вопрос про работу. Отсюда видна настоящая задача, а не пожелание."}, {"text": "Каким вы видите новый дневник?", "answer": "Современным. Чтобы всё было под рукой и красиво.", "requirement": null, "verdict": "Вопрос про образ — и ответ про образ. Записать нечего."}, {"text": "Вам нужна выгрузка в Excel?", "answer": "Да, конечно.", "requirement": null, "verdict": "Закрытый вопрос. «Да» здесь не значит «нужно» — значит «не откажусь»."}]}, {"question": "Что спросишь дальше?", "options": [{"text": "Что происходит, если отчёт опоздает?", "answer": "Департамент просит объяснительную. В прошлом году я писал две.", "requirement": "Отчёт за месяц готов до 5-го числа следующего месяца", "verdict": "Вот и цена ошибки — из неё и берётся срок в требовании."}, {"text": "Сколько человек будет пользоваться дневником?", "answer": "Все. Ученики, учителя, я. Человек семьсот.", "requirement": "Дневник рассчитан на всю школу одновременно", "verdict": "Число полезное, но пока это не требование, а контекст."}, {"text": "Вам важен дизайн главной страницы?", "answer": "Ну, чтобы прилично выглядело.", "requirement": null, "verdict": "Пустой ход."}]}, {"question": "Остался один вопрос.", "options": [{"text": "Кто ещё смотрит этот отчёт?", "answer": "Департамент образования. Формат у них свой, меняют примерно раз в год.", "requirement": "Формат отчёта меняется без переделки остальной системы", "verdict": "Нашёлся стейкхолдер, с которым ты никогда не поговоришь, — а требования у него обязательные."}, {"text": "Когда нужен готовый дневник?", "answer": "К весне. Но если не успеем — переживём.", "requirement": null, "verdict": "Срок мягкий, в требования его не запишешь."}, {"text": "Какой бюджет?", "answer": "Сколько дадут. На сервер в этом году точно не дадут.", "requirement": "Работает на существующем сервере, без закупки нового", "verdict": "Ограничение, которое определит половину решений в проекте."}]}]}, {"id": "teacher", "person": "Учитель математики", "role": "самый частый пользователь", "rounds": [{"question": "О чём спросишь учителя?", "options": [{"text": "Сколько оценок вы выставляете за урок и сколько это занимает?", "answer": "Тридцать, весь класс. Успеть надо за перемену — это четыре минуты, потом следующий класс.", "requirement": "Учитель выставляет оценки всему классу за время перемены", "verdict": "Мнение «неудобно» превратилось в число, которое можно проверить."}, {"text": "Вам нравится нынешний дневник?", "answer": "Нет, конечно.", "requirement": null, "verdict": "Ответ, под которым подпишется кто угодно. Пользы ноль."}, {"text": "Какие кнопки добавить на экран оценок?", "answer": "Не знаю, вам виднее.", "requirement": null, "verdict": "Это просьба к заказчику спроектировать систему за тебя."}]}, {"question": "Учитель добавляет: «И ещё нам нужна выгрузка успеваемости класса в таблицу».", "options": [{"text": "А что вы с этой таблицей делаете?", "answer": "Я — ничего. Это завуч просила передать, ей для отчёта.", "requirement": "Требование завуча: выгрузка успеваемости класса (источник — не учитель)", "verdict": "Вот требование, у которого не тот источник. Спросить «зачем» стоило именно здесь."}, {"text": "В каком формате — Excel или CSV?", "answer": "Наверное, Excel. Я не знаю.", "requirement": null, "verdict": "Чужое требование записано на учителя, а разговор ушёл в формат. Через полгода выяснится, что нужное было другое."}, {"text": "Хорошо, запишу.", "answer": "Спасибо.", "requirement": null, "verdict": "Требование записано, источник неверный. Защищать его будет некому."}]}, {"question": "Последний вопрос учителю.", "options": [{"text": "Что вы делаете, если ошиблись при выставлении?", "answer": "Прошу администратора поправить. Исправить самому нельзя — оценка закрывается.", "requirement": "Учитель исправляет свою оценку сам, в течение урока", "verdict": "Крайние случаи находятся именно так: «а что, если пошло не так?»"}, {"text": "Сколько у вас классов?", "answer": "Шесть.", "requirement": null, "verdict": "Контекст, не требование."}, {"text": "Пользуетесь ли вы дневником с телефона?", "answer": "Почти нет, я за компьютером в кабинете.", "requirement": null, "verdict": "Полезно знать: мобильная версия учителю не нужна. Но это не требование."}]}]}, {"id": "student", "person": "Ученик 10 класса", "role": "самая большая группа пользователей", "rounds": [{"question": "О чём спросишь ученика?", "options": [{"text": "Когда и откуда ты обычно открываешь дневник?", "answer": "Утром в автобусе, с телефона. Смотрю, что задали.", "requirement": "Домашнее задание открывается с телефона за несколько секунд", "verdict": "Условие использования выяснено: телефон, дорога, мало времени."}, {"text": "Тебе нравится дневник?", "answer": "Он тормозит.", "requirement": null, "verdict": "Жалоба без числа. Пока это не требование."}, {"text": "Хочешь, сделаем приложение?", "answer": "Давайте!", "requirement": null, "verdict": "Решение предложено — и принято. Так в проект попадает то, чего никто не просил."}]}, {"question": "Ученик говорит: «Он вообще не открывается». Что дальше?", "options": [{"text": "В какое время суток это обычно?", "answer": "Утром, перед первым уроком. Вечером нормально.", "requirement": "Скорость дневника меряется в утренний пик, а не в среднем за сутки", "verdict": "Жалоба превратилась в условие, при котором её можно проверить."}, {"text": "Совсем не открывается или просто медленно?", "answer": "Ну… медленно.", "requirement": null, "verdict": "Человеку предложено выбрать из двух твоих формулировок, а не рассказать самому."}, {"text": "У тебя старый телефон?", "answer": "Обычный.", "requirement": null, "verdict": "Виноватый назначен раньше, чем кто-то разобрался."}]}, {"question": "Последний вопрос.", "options": [{"text": "Что ты делаешь, когда дневник не открылся?", "answer": "Спрашиваю в чате класса. Обычно кто-нибудь уже сфотографировал доску.", "requirement": "Если дневник недоступен, ученик не остаётся без задания", "verdict": "Вот обходной путь, которым школа пользуется вместо системы. Это всегда след ненайденного требования."}, {"text": "Часто такое бывает?", "answer": "Ну, бывает.", "requirement": null, "verdict": "«Бывает» — не число."}, {"text": "Тебе важно, как дневник выглядит?", "answer": "Не особо.", "requirement": null, "verdict": "Ответ честный, требований не даёт."}]}]}, {"id": "sysadmin", "person": "Системный администратор", "role": "фактическое вето на запуск", "rounds": [{"question": "О чём спросишь сисадмина?", "options": [{"text": "Что происходит с сервером в самый тяжёлый момент дня?", "answer": "В восемь пятнадцать заходят все сразу. Дневник тогда и ложится.", "requirement": "Дневник выдерживает утренний пик без отказов", "verdict": "Вопрос про худший случай, а не про средний. Так и надо."}, {"text": "Сервер справляется?", "answer": "В среднем да.", "requirement": null, "verdict": "«В среднем да» — самый опасный ответ в проекте. Среднее прячет пик."}, {"text": "Какой у вас сервер?", "answer": "Старый.", "requirement": null, "verdict": "Характеристика без последствий."}]}, {"question": "Что дальше?", "options": [{"text": "Что должно случиться, чтобы вы не дали запустить V2?", "answer": "Если я не смогу откатиться назад за десять минут — не дам. Один раз уже переносили журнал, до сих пор данных не хватает.", "requirement": "Откат на V1 возможен в течение 10 минут после запуска", "verdict": "Вот условие, без которого проект просто не состоится."}, {"text": "Вы поддержите внедрение?", "answer": "Посмотрим.", "requirement": null, "verdict": "Вопрос про отношение, а не про условия."}, {"text": "Сколько времени у вас уходит на поддержку?", "answer": "Хватает.", "requirement": null, "verdict": "Пустой ход."}]}, {"question": "Последний вопрос.", "options": [{"text": "Кто ещё, кроме вас, может остановить запуск?", "answer": "Формально никто. Фактически — если учителя откажутся выставлять оценки в новом дневнике, его свернут через месяц.", "requirement": "Учителя переходят на V2 без потери привычного темпа работы", "verdict": "Тебе назвали риск, которого нет ни в одном документе."}, {"text": "Нужна ли вам админ-панель?", "answer": "Была бы кстати.", "requirement": null, "verdict": "Решение вместо задачи, и снова «не откажусь»."}, {"text": "Как часто дневник падает?", "answer": "Не считал.", "requirement": null, "verdict": "Никто не считал — значит, это и предстоит выяснить самому. По логам."}]}]}]};
const TOTAL = DATA.people.reduce((n, p) =>
  n + p.rounds.filter(r => r.options.some(o => o.requirement)).length, 0);
document.getElementById('total').textContent = TOTAL;

let current = null;                       // кого опрашиваем сейчас
const turns = {};                         // сколько ходов сделано с каждым
const log = {};                           // расшифровка по собеседнику
const found = [];                         // {требование, источник}
DATA.people.forEach(p => { turns[p.id] = 0; log[p.id] = []; });

function esc(s) { const d = document.createElement('div'); d.textContent = s; return d.innerHTML; }
const done = p => turns[p.id] >= p.rounds.length;

function renderPeople() {
  document.getElementById('people').innerHTML = DATA.people.map(p => `
    <button class="person${done(p) ? ' done' : ''}" data-id="${p.id}"
            aria-pressed="${current === p.id}">${esc(p.person)}
      <span class="role">${esc(p.role)}</span></button>`).join('');
  document.querySelectorAll('.person').forEach(b =>
    b.onclick = () => { current = b.dataset.id; render(); });
}

function renderSheet() {
  document.getElementById('score').textContent = found.length;
  const body = found.length
    ? '<tr><th>Требование</th><th>Источник</th></tr>' + found.map(f =>
        `<tr><td>${esc(f.req)}</td><td class="src">${esc(f.src)}</td></tr>`).join('')
    : '<tr><td class="none">пока пусто</td></tr>';
  document.getElementById('sheet').innerHTML = `<tbody>${body}</tbody>`;
}

function renderFinish() {
  const el = document.getElementById('finish');
  if (!DATA.people.every(done)) { el.innerHTML = ''; return; }
  const missed = TOTAL - found.length;
  const text = missed === 0
    ? '<b>Круг закрыт, и собрано всё.</b> Заметь, какие вопросы сработали: про сегодняшнюю работу, про худший случай и про то, что бывает, когда система подводит.'
    : `Круг закрыт. В списке ${found.length} из ${TOTAL}. Ненайденное не исчезло — оно всплывёт на приёмке, когда менять дорого. Можно пройти заново и попробовать другие вопросы.`;
  el.innerHTML = `<div class="final fade">${text}</div>
    <button class="again" id="again">Пройти круг заново</button>`;
  document.getElementById('again').onclick = () => {
    DATA.people.forEach(p => { turns[p.id] = 0; log[p.id] = []; });
    found.length = 0; current = null; render();
  };
}

function render() {
  renderPeople();
  const stage = document.getElementById('stage');
  const p = DATA.people.find(x => x.id === current);
  if (!p) {
    stage.innerHTML = '<p class="sub">Выбери собеседника.</p>';
  } else {
    const history = log[p.id].map(t => `
      <div class="said mine"><div class="who">ты</div><div>${esc(t.q)}</div></div>
      <div class="said"><div class="who">${esc(p.person).toLowerCase()}</div><div>${esc(t.a)}</div></div>
      <div class="verdict">${esc(t.v)}${t.req ? `<div class="got">→ в список: ${esc(t.req)}</div>` : ''}</div>`).join('');
    const i = turns[p.id];
    stage.innerHTML = history + (i < p.rounds.length ? `
      <div class="fade" style="margin-top:18px">
        <div class="turn">${esc(p.person)} · вопрос ${i + 1} из ${p.rounds.length}</div>
        <div class="q">${esc(p.rounds[i].question)}</div>
        <div class="opts">${p.rounds[i].options.map((o, k) =>
          `<button class="opt" data-k="${k}">${esc(o.text)}</button>`).join('')}</div>
      </div>` : '<div class="verdict" style="margin-top:18px">Разговор окончен. Выбери следующего собеседника.</div>');
    stage.querySelectorAll('.opt').forEach(b => b.onclick = () => choose(p, +b.dataset.k));
  }
  renderSheet();
  renderFinish();
}

function choose(p, k) {
  const o = p.rounds[turns[p.id]].options[k];
  log[p.id].push({ q: o.text, a: o.answer, v: o.verdict, req: o.requirement });
  if (o.requirement && !found.some(f => f.req === o.requirement)) {
    found.push({ req: o.requirement, src: p.person });
  }
  turns[p.id]++;
  render();
}

render();
</script>
</body>
</html>
