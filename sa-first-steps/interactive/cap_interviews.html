<!doctype html>
<html lang="ru">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Круг интервью</title>
<style>
  :root {
    color-scheme: light;
    --surface: #fcfcfb; --ink: #0b0b0b; --ink2: #52514e; --muted: #898781;
    --grid: #e1e0d9; --axis: #c3c2b7; --s1: #2a78d6; --s2: #eb6834; --good: #006300;
  }
  * { box-sizing: border-box; }
  body { margin: 0; background: var(--surface); color: var(--ink);
         font: 15px/1.45 system-ui, -apple-system, "Segoe UI", sans-serif; }
  .wrap { max-width: 820px; margin: 0 auto; padding: 16px; }
  h1 { font-size: 18px; margin: 0 0 4px; font-weight: 600; }
  .sub { color: var(--ink2); margin: 0 0 14px; }

  .people { display: flex; flex-wrap: wrap; gap: 8px; margin-bottom: 16px; }
  .person { font: inherit; font-size: 13px; text-align: left; padding: 8px 12px; border-radius: 10px;
            border: 1px solid var(--axis); background: #fff; color: var(--ink); cursor: pointer;
            transition: border-color .12s ease, background .12s ease; }
  .person:hover { border-color: var(--s1); }
  .person[aria-pressed="true"] { border-color: var(--s1); background: #eaf2fd; }
  .person.done::after { content: " ✓"; color: var(--good); }
  .person .role { display: block; color: var(--muted); font-size: 11px; }

  .turn { color: var(--muted); font-size: 13px; margin-bottom: 6px; }
  .q { font-weight: 600; margin-bottom: 10px; }
  .opts { display: grid; gap: 8px; }
  button.opt { font: inherit; text-align: left; padding: 10px 12px; border-radius: 10px;
               border: 1px solid var(--axis); background: #fff; color: var(--ink); cursor: pointer; }
  button.opt:hover { border-color: var(--s1); }
  .said { border-left: 3px solid var(--axis); padding: 2px 0 2px 12px; margin: 14px 0 0; }
  .said .who { color: var(--muted); font-size: 13px; }
  .mine .who { color: var(--s1); }
  .verdict { margin-top: 10px; padding: 10px 12px; border-radius: 10px; background: #f3f2ec;
             color: var(--ink2); }
  .got { margin-top: 8px; color: var(--good); font-weight: 600; font-size: 14px; }

  .sheet { margin-top: 18px; border-top: 1px solid var(--grid); padding-top: 12px; }
  .sheet h2 { font-size: 14px; margin: 0 0 8px; color: var(--ink2); font-weight: 600; }
  table { border-collapse: collapse; width: 100%; font-size: 13.5px; }
  th, td { text-align: left; padding: 5px 8px; border-bottom: 1px solid var(--grid); vertical-align: top; }
  th { color: var(--muted); font-weight: 600; font-size: 12px; }
  td.src { color: var(--ink2); white-space: nowrap; }
  .none { color: var(--muted); }
  .count { font-variant-numeric: tabular-nums; }
  .final { margin-top: 14px; padding: 12px 14px; border-radius: 10px; border: 1px solid var(--axis);
           background: #fff; }
  button.again { font: inherit; padding: 7px 14px; border-radius: 8px; border: 1px solid var(--axis);
                 background: #fff; color: var(--ink2); cursor: pointer; margin-top: 12px; }
  .fade { animation: fade .22s ease-out; }
  @keyframes fade { from { opacity: 0; transform: translateY(3px); } to { opacity: 1; transform: none; } }
  @media (prefers-reduced-motion: reduce) { .fade { animation: none; } }
</style>
</head>
<body>
<div class="wrap">
  <h1 id="title">Круг интервью</h1>
  <p class="sub" id="sub">Четыре собеседника, по три вопроса каждому. Сильный вопрос приносит требование в список
     справа, слабый — вежливый ответ ни о чём. Выбирай, с кого начать.</p>

  <div class="people" id="people"></div>
  <div id="stage"></div>

  <div class="sheet">
    <h2>Список требований: <span class="count" id="score">0</span> из
        <span class="count" id="total"></span></h2>
    <table id="sheet"><tbody><tr><td class="none">пока пусто</td></tr></tbody></table>
  </div>
  <div id="finish"></div>
</div>
<script>
const DATA = {"people": [{"id": "deputy", "person": "Завуч по воспитательной работе", "role": "заказчик", "rounds": [{"question": "С чего начнёшь?", "options": [{"text": "Как сейчас идёт запись в кружки?", "answer": "Руководители кружков приносят мне бумажные списки. Неделю сверяю, чтобы у ученика не стояло два занятия в одно время.", "requirement": "Запись не допускает двух занятий у ученика в одно время", "verdict": "Вопрос про сегодняшнюю работу — и сразу видна боль."}, {"text": "Какой должна быть запись?", "answer": "Удобной.", "requirement": null, "verdict": "Слово, с которого начинался весь курс."}, {"text": "Нужно ли мобильное приложение?", "answer": "Было бы здорово.", "requirement": null, "verdict": "Закрытый вопрос с решением внутри."}]}, {"question": "Что спросишь дальше?", "options": [{"text": "Что происходит, когда в кружке кончаются места?", "answer": "Руководитель вычёркивает тех, кто записался позже, и ученик узнаёт об этом только на первом занятии.", "requirement": "Запись закрывается, когда места кончились, и ученик сразу это видит", "verdict": "Вопрос про то, что идёт не так, — отсюда крайний случай и требование."}, {"text": "Сколько всего кружков?", "answer": "Около тридцати.", "requirement": null, "verdict": "Контекст, не требование."}, {"text": "Когда нужна система?", "answer": "К сентябрю.", "requirement": null, "verdict": "Срок полезно знать, но это не требование к системе."}]}]}, {"id": "leader", "person": "Руководитель кружка", "role": "ведёт занятия", "rounds": [{"question": "О чём спросишь?", "options": [{"text": "Сколько человек помещается в кружок и почему?", "answer": "Пятнадцать: столько компьютеров в кабинете.", "requirement": "У каждого кружка задан предел мест", "verdict": "Число с источником — физическое ограничение."}, {"text": "Вам нравится идея электронной записи?", "answer": "Наверное.", "requirement": null, "verdict": "Вопрос про отношение, а не про работу."}, {"text": "Какого цвета сделать кнопку записи?", "answer": "Без разницы.", "requirement": null, "verdict": "Интерфейс — не твоя часть работы."}]}, {"question": "Последний вопрос.", "options": [{"text": "Для кого ваш кружок?", "answer": "Для 5–7 классов. Старшим скучно, младшим сложно.", "requirement": "Кружок видят и могут записаться только классы, для которых он предназначен", "verdict": "Ограничение, о котором заказчик не упомянул, — такие потом и забывают."}, {"text": "Как вы отмечаете посещаемость?", "answer": "В тетради.", "requirement": null, "verdict": "Интересно, но это другая задача — не запись."}, {"text": "Сколько лет вы ведёте кружок?", "answer": "Восемь.", "requirement": null, "verdict": "Контекст, не требование."}]}]}, {"id": "homeroom", "person": "Классный руководитель", "role": "предлагает решение", "rounds": [{"question": "О чём спросишь?", "options": [{"text": "Как вы сейчас узнаёте, кто в классе чем занят после уроков?", "answer": "Каждую осень раздаю анкету: сколько часов в неделю ребёнок занят в кружках и секциях.", "requirement": "Классный руководитель видит внеурочную занятость класса без анкеты", "verdict": "Анкета раз в год — обходной путь, а обходной путь всегда след требования."}, {"text": "Нужна ли вам электронная запись?", "answer": "Не мне решать.", "requirement": null, "verdict": "Вопрос про чужое решение, а не про свою работу."}, {"text": "Ученики довольны кружками?", "answer": "Кто как.", "requirement": null, "verdict": "Ответ под стать вопросу."}]}, {"question": "Классный руководитель добавляет: «Дети перегружены. Давайте запретим записываться больше чем на 6 часов в неделю».", "options": [{"text": "А сколько учеников сейчас занято больше шести часов?", "answer": "Точно не знаю. Много, наверное.", "requirement": null, "verdict": "Правильный вопрос — и ответ «наверное». Проверять придётся по данным."}, {"text": "Хорошо, запишу ограничение.", "answer": "Спасибо.", "requirement": null, "verdict": "Решение записано без проверки. Кого оно заденет — неизвестно."}, {"text": "Кого вы хотите защитить этим запретом?", "answer": "Тех, кто из-за секций еле успевает с учёбой.", "requirement": null, "verdict": "Хороший вопрос про цель. Но сколько таких учеников — всё ещё неизвестно."}]}]}], "title": "Круг интервью: запись в кружки", "sub": "Три собеседника, по два вопроса каждому. В этот раз без подсказок в условии — только то, что ты уже умеешь."};
if (DATA.title) document.getElementById('title').textContent = DATA.title;
if (DATA.sub) document.getElementById('sub').textContent = DATA.sub;
const TOTAL = DATA.people.reduce((n, p) =>
  n + p.rounds.filter(r => r.options.some(o => o.requirement)).length, 0);
document.getElementById('total').textContent = TOTAL;

let current = null;                       // кого опрашиваем сейчас
const turns = {};                         // сколько ходов сделано с каждым
const log = {};                           // расшифровка по собеседнику
const found = [];                         // {требование, источник}
DATA.people.forEach(p => { turns[p.id] = 0; log[p.id] = []; });

function esc(s) { const d = document.createElement('div'); d.textContent = s; return d.innerHTML; }
const done = p => turns[p.id] >= p.rounds.length;

function renderPeople() {
  document.getElementById('people').innerHTML = DATA.people.map(p => `
    <button class="person${done(p) ? ' done' : ''}" data-id="${p.id}"
            aria-pressed="${current === p.id}">${esc(p.person)}
      <span class="role">${esc(p.role)}</span></button>`).join('');
  document.querySelectorAll('.person').forEach(b =>
    b.onclick = () => { current = b.dataset.id; render(); });
}

function renderSheet() {
  document.getElementById('score').textContent = found.length;
  const body = found.length
    ? '<tr><th>Требование</th><th>Источник</th></tr>' + found.map(f =>
        `<tr><td>${esc(f.req)}</td><td class="src">${esc(f.src)}</td></tr>`).join('')
    : '<tr><td class="none">пока пусто</td></tr>';
  document.getElementById('sheet').innerHTML = `<tbody>${body}</tbody>`;
}

function renderFinish() {
  const el = document.getElementById('finish');
  if (!DATA.people.every(done)) { el.innerHTML = ''; return; }
  const missed = TOTAL - found.length;
  const text = missed === 0
    ? '<b>Круг закрыт, и собрано всё.</b> Заметь, какие вопросы сработали: про сегодняшнюю работу, про худший случай и про то, что бывает, когда система подводит.'
    : `Круг закрыт. В списке ${found.length} из ${TOTAL}. Ненайденное не исчезло — оно всплывёт на приёмке, когда менять дорого. Можно пройти заново и попробовать другие вопросы.`;
  el.innerHTML = `<div class="final fade">${text}</div>
    <button class="again" id="again">Пройти круг заново</button>`;
  document.getElementById('again').onclick = () => {
    DATA.people.forEach(p => { turns[p.id] = 0; log[p.id] = []; });
    found.length = 0; current = null; render();
  };
}

function render() {
  renderPeople();
  const stage = document.getElementById('stage');
  const p = DATA.people.find(x => x.id === current);
  if (!p) {
    stage.innerHTML = '<p class="sub">Выбери собеседника.</p>';
  } else {
    const history = log[p.id].map(t => `
      <div class="said mine"><div class="who">ты</div><div>${esc(t.q)}</div></div>
      <div class="said"><div class="who">${esc(p.person).toLowerCase()}</div><div>${esc(t.a)}</div></div>
      <div class="verdict">${esc(t.v)}${t.req ? `<div class="got">→ в список: ${esc(t.req)}</div>` : ''}</div>`).join('');
    const i = turns[p.id];
    stage.innerHTML = history + (i < p.rounds.length ? `
      <div class="fade" style="margin-top:18px">
        <div class="turn">${esc(p.person)} · вопрос ${i + 1} из ${p.rounds.length}</div>
        <div class="q">${esc(p.rounds[i].question)}</div>
        <div class="opts">${p.rounds[i].options.map((o, k) =>
          `<button class="opt" data-k="${k}">${esc(o.text)}</button>`).join('')}</div>
      </div>` : '<div class="verdict" style="margin-top:18px">Разговор окончен. Выбери следующего собеседника.</div>');
    stage.querySelectorAll('.opt').forEach(b => b.onclick = () => choose(p, +b.dataset.k));
  }
  renderSheet();
  renderFinish();
}

function choose(p, k) {
  const o = p.rounds[turns[p.id]].options[k];
  log[p.id].push({ q: o.text, a: o.answer, v: o.verdict, req: o.requirement });
  if (o.requirement && !found.some(f => f.req === o.requirement)) {
    found.push({ req: o.requirement, src: p.person });
  }
  turns[p.id]++;
  render();
}

render();
</script>
</body>
</html>
