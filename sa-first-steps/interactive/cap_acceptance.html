<!doctype html>
<html lang="ru">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>ПриёмкаV2</title>
<style>
  :root {
    color-scheme: light;
    --surface: #fcfcfb; --ink: #0b0b0b; --ink2: #52514e; --muted: #898781;
    --grid: #e1e0d9; --axis: #c3c2b7; --s1: #2a78d6; --s2: #eb6834; --good: #006300;
    --bad: #b5271b;
  }
  * { box-sizing: border-box; }
  body { margin: 0; background: var(--surface); color: var(--ink);
         font: 15px/1.45 system-ui, -apple-system, "Segoe UI", sans-serif; }
  .wrap { max-width: 900px; margin: 0 auto; padding: 16px; }
  h1 { font-size: 18px; margin: 0 0 4px; font-weight: 600; }
  .sub { color: var(--ink2); margin: 0 0 14px; }

  .tabs { display: flex; flex-wrap: wrap; gap: 6px; margin-bottom: 14px; }
  .tab { font: inherit; font-size: 13px; padding: 6px 11px; border-radius: 999px;
         border: 1px solid var(--axis); background: #fff; color: var(--ink2); cursor: pointer; }
  .tab[aria-pressed="true"] { background: var(--s1); border-color: var(--s1); color: #fff; }
  .tab.seen::after { content: " ·"; }
  .tab.judged::after { content: " ✓"; color: var(--good); }
  .tab[aria-pressed="true"].judged::after { color: #fff; }

  .screen { border: 1px solid var(--grid); border-radius: 12px; background: #fff; overflow: hidden;
            margin-bottom: 14px; }
  .screen .bar { padding: 9px 14px; border-bottom: 1px solid var(--grid); font-weight: 600;
                 background: #f7f6f1; }
  .screen .body { padding: 12px 14px; }
  table { border-collapse: collapse; width: 100%; font-size: 13.5px; }
  th, td { text-align: left; padding: 5px 10px; border-bottom: 1px solid var(--grid); }
  th { color: var(--muted); font-weight: 600; font-size: 12px; }
  .note { color: var(--ink2); font-size: 13px; margin-top: 8px; }

  .spec { border-left: 3px solid var(--axis); padding: 4px 0 4px 12px; margin: 0 0 12px;
          color: var(--ink2); font-size: 14px; }
  .spec b { color: var(--ink); }

  .verdicts { display: grid; gap: 7px; }
  button.v { font: inherit; text-align: left; padding: 9px 12px; border-radius: 10px;
             border: 1px solid var(--axis); background: #fff; color: var(--ink); cursor: pointer; }
  button.v:hover { border-color: var(--s1); }
  button.v:disabled { cursor: default; opacity: .75; }
  button.v.picked { border-color: var(--s1); background: #eaf2fd; }
  button.v.right { border-color: #bfe0cc; background: #f4faf6; }
  .explain { margin-top: 10px; padding: 10px 12px; border-radius: 10px; background: #f3f2ec;
             color: var(--ink2); }
  .explain b { color: var(--ink); }

  .tally { margin-top: 16px; border-top: 1px solid var(--grid); padding-top: 12px;
           color: var(--ink2); font-size: 14px; }
  .tally b { color: var(--ink); }
  .final { margin-top: 12px; padding: 12px 14px; border-radius: 10px; border: 1px solid var(--axis);
           background: #fff; }
  .fade { animation: fade .22s ease-out; }
  @keyframes fade { from { opacity: 0; transform: translateY(3px); } to { opacity: 1; transform: none; } }
  @media (prefers-reduced-motion: reduce) { .fade { animation: none; } }
</style>
</head>
<body>
<div class="wrap">
  <h1 id="title">Приёмка: что прислал подрядчик</h1>
  <p class="sub" id="sub">Шесть экранов. По каждому сверь то, что видишь, с тем, что написано в ТЗ, и реши,
     чей это промах. Категорию выбираешь один раз.</p>

  <div class="tabs" id="tabs"></div>
  <div id="stage"></div>
  <div class="tally" id="tally"></div>
  <div id="final"></div>
</div>
<script>
const DATA = {"screens": [{"id": "places", "short": "Места", "answer": "broken", "title": "Кружок «Программирование», 5–7 классы", "columns": ["Мест", "Записано", "Статус записи"], "rows": [["15", "17", "открыта"]], "note": "Двое записались уже после того, как места кончились.", "spec": "запись закрывается, когда места кончились, и ученик сразу это видит", "explain": "Требование записано ясно и нарушено: 17 записей при 15 местах. Исправляет подрядчик."}, {"id": "left", "short": "Выбывшие", "answer": "gap", "title": "Список кружка «Шахматы» глазами руководителя", "columns": ["Ученик", "Класс"], "rows": [["S90011", "6А"], ["S90012", "6А (выбыл из школы в октябре)"], ["S90013", "6Б"]], "note": "Выбывший ученик занимает место в списке.", "spec": "руководитель кружка видит список записавшихся", "explain": "Про выбывших в ТЗ не сказано ничего — подрядчик имел право показать всех, кто когда-либо записывался. Это дыра в задании, и знакомая: тот же крайний случай был в самой первой задаче курса про список класса."}, {"id": "view", "short": "Занятость класса", "answer": "literal", "title": "Занятость класса 7Б для классного руководителя", "columns": ["Как получить", "Как часто обновляется"], "rows": [["кнопка «Скачать файл»", "раз в месяц"]], "note": "Внутри файла — список учеников с часами в неделю.", "spec": "классный руководитель видит внеурочную занятость своего класса", "explain": "Формально видит — в файле раз в месяц. Но цель была замечать проблему вовремя, а месячная выгрузка этого не даёт. Нарушения нет, остаётся договариваться."}], "categories": [{"id": "broken", "label": "Нарушено ТЗ — требуем исправить за счёт подрядчика"}, {"id": "gap", "label": "В ТЗ этого не было — моя недоработка, переделка за наш счёт"}, {"id": "literal", "label": "Формально выполнено, а вышло плохо — договариваемся"}], "title": "Приёмка: запись в кружки", "sub": "Три экрана — по одному на каждую категорию. Сверь с ТЗ и реши, чей это промах."};
if (DATA.title) document.getElementById('title').textContent = DATA.title;
if (DATA.sub) document.getElementById('sub').textContent = DATA.sub;
const picked = {};                       // id экрана → выбранная категория
let current = 0;

function esc(s) { const d = document.createElement('div'); d.textContent = s; return d.innerHTML; }

function renderTabs() {
  document.getElementById('tabs').innerHTML = DATA.screens.map((s, i) => `
    <button class="tab${picked[s.id] ? ' judged' : ''}" data-i="${i}"
            aria-pressed="${i === current}">${esc(s.short)}</button>`).join('');
  document.querySelectorAll('.tab').forEach(b =>
    b.onclick = () => { current = +b.dataset.i; render(); });
}

function renderScreen(s) {
  const rows = s.rows.map(r => `<tr>${r.map(c => `<td>${esc(c)}</td>`).join('')}</tr>`).join('');
  const head = s.columns.map(c => `<th>${esc(c)}</th>`).join('');
  return `<div class="screen">
      <div class="bar">${esc(s.title)}</div>
      <div class="body">
        <table><thead><tr>${head}</tr></thead><tbody>${rows}</tbody></table>
        ${s.note ? `<div class="note">${esc(s.note)}</div>` : ''}
      </div>
    </div>`;
}

function render() {
  renderTabs();
  const s = DATA.screens[current];
  const chosen = picked[s.id];
  const buttons = DATA.categories.map(c => {
    const cls = chosen ? (c.id === s.answer ? ' right' : (c.id === chosen ? ' picked' : '')) : '';
    return `<button class="v${cls}" data-c="${c.id}" ${chosen ? 'disabled' : ''}>${esc(c.label)}</button>`;
  }).join('');
  document.getElementById('stage').innerHTML = `
    <div class="fade">
      ${renderScreen(s)}
      <p class="spec"><b>В твоём ТЗ написано:</b> ${esc(s.spec)}</p>
      <div class="verdicts">${buttons}</div>
      ${chosen ? `<div class="explain">${chosen === s.answer
          ? '<b>Верно.</b> ' : '<b>Не совсем.</b> '}${esc(s.explain)}</div>` : ''}
    </div>`;
  if (!chosen) {
    document.querySelectorAll('.v').forEach(b =>
      b.onclick = () => { picked[s.id] = b.dataset.c; render(); });
  }
  renderTally();
}

function renderTally() {
  const done = Object.keys(picked).length;
  const right = DATA.screens.filter(s => picked[s.id] === s.answer).length;
  const mine = DATA.screens.filter(s => picked[s.id] && s.answer === 'gap').length;
  document.getElementById('tally').innerHTML =
    `Разобрано экранов: <b>${done}</b> из <b>${DATA.screens.length}</b>. ` +
    `Категория угадана верно: <b>${right}</b>.`;
  const el = document.getElementById('final');
  if (done < DATA.screens.length) { el.innerHTML = ''; return; }
  const byGap = DATA.screens.filter(s => s.answer === 'gap').length;
  el.innerHTML = `<div class="final fade">
      <b>Протокол готов.</b> Из ${DATA.screens.length} расхождений нарушением ТЗ оказались
      ${DATA.screens.filter(s => s.answer === 'broken').length},
      дырами в самом ТЗ — ${byGap},
      а ${DATA.screens.filter(s => s.answer === 'literal').length} подрядчик выполнил буквально.
      Последние две категории — твоя часть ответственности, и платить за переделку по ним будет школа.
    </div>`;
}

render();
</script>
</body>
</html>
