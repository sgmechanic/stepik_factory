<!doctype html>
<html lang="ru">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Ползунок порога</title>
<style>
  :root { color-scheme: light; --surface: #fcfcfb; --ink: #0b0b0b; --ink2: #52514e; --muted: #898781;
          --grid: #e1e0d9; --axis: #c3c2b7; --s1: #2a78d6; --s2: #eb6834; --good: #006300; --warn: #b54708; }
  * { box-sizing: border-box; }
  body { margin: 0; background: var(--surface); color: var(--ink); font: 15px/1.45 system-ui, -apple-system, "Segoe UI", sans-serif; }
  .wrap { max-width: 760px; margin: 0 auto; padding: 16px; }
  h1 { font-size: 18px; margin: 0 0 4px; font-weight: 600; }
  .sub { color: var(--ink2); margin: 0 0 12px; }
  label { display: block; font-size: 13px; color: var(--ink2); }
  label b { color: var(--ink); font-variant-numeric: tabular-nums; }
  input[type=range] { width: 100%; accent-color: var(--s1); }
  table { border-collapse: collapse; margin: 12px 0; font-variant-numeric: tabular-nums; width: 100%; max-width: 460px; }
  td, th { border: 1px solid var(--grid); padding: 8px 10px; text-align: center; }
  th { color: var(--ink2); font-weight: 500; font-size: 13px; }
  td.hit { background: #e3f1e3; } td.miss { background: #fbe9e0; } td.fa { background: #fdf3dc; }
  .kpi { display: flex; flex-wrap: wrap; gap: 8px 28px; }
  .kpi div { font-size: 13px; color: var(--ink2); }
  .kpi b { display: block; font-size: 22px; color: var(--ink); font-weight: 600; }
  .cap { margin-top: 10px; font-weight: 600; min-height: 1.4em; }
  .cap.ok { color: var(--good); } .cap.over { color: var(--warn); }
</style>
</head>
<body>
<div class="wrap">
  <h1>Ползунок порога</h1>
  <p class="sub" id="sub"></p>
  <label>Порог уверенности: <b id="tVal"></b><input id="t" type="range" min="0.02" max="0.98" step="0.01"></label>
  <table aria-label="Матрица ошибок">
    <tr><th></th><th>Модель подняла тревогу</th><th>Модель спокойна</th></tr>
    <tr><th>Помощь понадобилась</th><td class="hit" id="tp"></td><td class="miss" id="fn"></td></tr>
    <tr><th>Не понадобилась</th><td class="fa" id="fp"></td><td id="tn"></td></tr>
  </table>
  <div class="kpi">

    <div>Precision — верных тревог<b id="prec"></b></div>
    <div>Тревог (консультаций)<b id="alarms"></b></div>
  </div>
  <div class="cap" id="cap" aria-live="polite"></div>
</div>
